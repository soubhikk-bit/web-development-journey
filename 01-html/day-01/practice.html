<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration form</title>
</head>
<body>
  <form action="">
    <label for="name">Name:-</label>
    <input type="text" id="name">
    <br><br>

    <label for="email">email:-</label>
    <input type="email" name="" id="email"><br><br>

    <label for="pass">password:-</label>
    <input type="password" name="" id="pass"><br><br>

    <label for="age">Age:-</label>
    <input type="number" name="" id="age"><br><br>

    
    <label>Gender:-</label>
    <label for="male">Male</label>
    <input type="radio" name="gender" id="male">
    <label for="female">Female</label>
    <input type="radio" name="gender" id="female">
    <label for="others">Others</label>
    <input type="radio" name="gender" id="others">
     <br><br>

    <label>Skills:-</label>
    <label for="java">JAVA</label>
    <input type="checkbox" name="skill" id="java">
    <label for="dsa">DSA</label>
    <input type="checkbox" name="skill" id="dsa">
    <label for="html">HTML</label>
    <input type="checkbox" name="skill" id="html"> <br><br>

    <label for="country">Country:-</label>
    <select name="" id="country">
      <optgroup label="Asia">
        <option value="India">India</option>
        <option value="japan">japan</option>
        <option value="korea">korea</option>
      </optgroup>
      <optgroup label="Europe">
        <option value="America">America</option>
        <option value="London">England</option>
        <option value="France">France</option>
      </optgroup>
    </select><br><br>

    <label for="message">Message:-</label>
    <textarea name="text" id="message"></textarea><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

  </form>
</body>
</html>
